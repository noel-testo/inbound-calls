# Everything the caller hears verbatim. NOEL: every TODO must be approved before Phase 5.
# These are spoken as written, never paraphrased by the model.

business_name: ControlFreq
assistant_name: Cody           # the AI assistant introduces itself by this name (DECISIONS 2026-10-09)
expert_name: "Noel Sesto"       # takes the discovery calls
expert_title: "our Technical Director"

business_hours:
  timezone: Europe/London
  weekdays: "TODO 09:00-17:30"
  saturday: closed
  sunday: closed

greeting: >
  Thanks for calling ControlFreq. Calls may be transcribed for quality and training purposes. I'm Cody,
  an AI assistant trained to answer anything related to ControlFreq. Please tell me what you're looking
  for and I'll direct your call.

# Per-line greetings (config/lines.yaml), delivered as `first_message` by the conversation-init
# webhook. A line with no entry here, and the default line, use `greeting` above. All five line
# greetings below are approved by Noel (2026-11-10) and spoken exactly as written.
line_greetings:
  noel-direct: "Thanks for calling Noel Sesto at ControlFreq. I'm Cody, Noel's AI assistant. This call will be transcribed. Let me try and put you through. Who's calling, please, and what's the nature of the call?"
  sales: >
    Thanks for calling ControlFreq sales. Calls may be transcribed for quality and training purposes.
    I'm Cody, an AI assistant. Please tell me what you're looking for and I'll direct your call.
  accounts: >
    Thanks for calling ControlFreq accounts. Calls may be transcribed for quality and training
    purposes. I'm Cody, an AI assistant. Please tell me what your call is about and I'll pass it on.
  support: >
    Thanks for calling ControlFreq support. Calls may be transcribed for quality and training
    purposes. I'm Cody, an AI assistant. Please tell me what the problem is and I'll pass it on.
  parking: >
    Thanks for calling ControlFreq about car park solutions. Calls may be transcribed for quality
    and training purposes. I'm Cody, an AI assistant. Please tell me what you're looking for and
    I'll direct your call.

silence_prompt: "Are you still there?"

closing: >
  TODO — Thanks for calling ControlFreq. Goodbye.

# Spoken verbatim, first, when a caller describes an active emergency (for example someone trapped
# in a lift or an alarm not reporting right now). Must be written by Noel: it may need to direct the
# caller to a specific emergency line or service.
emergency_instruction: "TODO"

# One-line deflections (§5.1). Spoken as written.
deflections:
  pricing: "I can't give pricing on this call, but {expert_name}, {expert_title}, can on the discovery call."
  sla_or_promise: "I can't commit to timescales, but I'll make sure the team has the details."
  are_you_human: "I'm ControlFreq's AI assistant. I can take details and book a call with {expert_name}, {expert_title}."
  engineering_advice: "I'm not able to advise on that, but I'll log it for an engineer."
  card_details: "I can't take payment details. The team will contact you about that."
