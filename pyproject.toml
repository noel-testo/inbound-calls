[project]
name = "inbound-calls"
version = "0.0.0"
description = "ControlFreq self-hosted AI call answering service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# fastapi + uvicorn run the ElevenLabs webhook service (agent/app.py); the voice loop is hosted by
# ElevenLabs, so there are no STT/LLM/TTS SDKs here.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
