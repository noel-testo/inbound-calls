# LiveKit SIP service. In Phase 2 the inbound trunk is locked to accept INVITEs only
# from Telnyx by IP allowlist (inbound-only MVP — no SIP credentials). Connects to
# livekit-server via the env vars in docker-compose.yml (LIVEKIT_WS_URL, LIVEKIT_API_KEY,
# LIVEKIT_API_SECRET).
sip_port: 5060
rtp_port: 10000-10200
# Advertise the host's public IP in SDP (bridge networking). Without this, media
# connects to the container's private address and the call has no audio. Alternative:
# run this service with `network_mode: host`. Decide at Phase 2 build (SPEC §12);
# validate the exact key against the livekit-sip version in use.
use_external_ip: true
redis:
  address: redis:6379
logging:
  level: info
  json: true
