# LiveKit server — self-hosted. Phase 0 brings this up. The inbound SIP trunk and
# the dispatch rule (every call -> agent inbound-receptionist, room call-<uuid>) are
# provisioned in Phase 2 by scripts/provision_livekit.py.
#
# The API key/secret are injected via the LIVEKIT_KEYS env var (see docker-compose.yml);
# they are never written here. Secrets live only in ../.env.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false          # all media stays on the compose network in the MVP
redis:
  address: redis:6379
logging:
  level: info
  json: true
