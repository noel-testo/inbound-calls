# Inbound Calls — host stack. Pin every image tag (docs/DECISIONS.md). All secrets from ../.env.
# Ingress is Telnyx → ElevenLabs (external) and the voice loop is ElevenLabs. This host runs only the
# webhook service for the three Cal.com tools (ElevenLabs calls it) and Caddy for TLS. Caller lookup
# and post-call run in n8n, not here. No database, no LiveKit / Redis / SIP / Windmill.

services:
  agent:
    build:
      context: ..                    # repo root: the image needs pyproject.toml + uv.lock
      dockerfile: agent/Dockerfile   # the webhook service (FastAPI + uvicorn)
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../config:/app/config:ro
    # No public ports: Caddy terminates TLS and reverse-proxies ElevenLabs' webhook calls here.

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [agent]

volumes:
  caddy_data:
