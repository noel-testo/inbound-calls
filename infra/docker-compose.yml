# Inbound Calls — host stack. Phase 0: pin every image tag and record it in docs/DECISIONS.md.
# All secrets come from ../.env. Nothing LiveKit-related is published to the host network except
# what FreeSWITCH needs to reach RingCentral.

services:
  redis:
    image: redis:7-alpine            # PIN
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server    # PIN
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]
    # Not published: the agent and livekit-sip reach it on the compose network.

  livekit-sip:
    image: livekit/sip               # PIN
    restart: unless-stopped
    volumes:
      - ./livekit/sip.yaml:/etc/sip.yaml:ro
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
    depends_on: [livekit, redis]
    # Not published: only FreeSWITCH sends INVITEs, on the compose network.

  freeswitch:
    build: ./freeswitch              # PIN base image in the Dockerfile
    restart: unless-stopped
    network_mode: host               # simplest correct NAT behaviour for a registered device + RTP
    env_file: ../.env
    volumes:
      - ./freeswitch/conf:/etc/freeswitch:ro
      - ${RECORDINGS_DIR:-/var/recordings}:/var/recordings
    # Host firewall: allow the configured RTP range (udp) inbound; SIP is outbound-registered.

  agent:
    build: ../agent
    restart: unless-stopped
    env_file: ../.env
    depends_on: [livekit]
    volumes:
      - ../config:/app/config:ro

  windmill-server:
    image: ghcr.io/windmill-labs/windmill   # PIN
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL}
      MODE: server
    depends_on: []

  windmill-worker:
    image: ghcr.io/windmill-labs/windmill   # PIN (same tag as server)
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL}
      MODE: worker
      WORKER_GROUP: default
    depends_on: [windmill-server]

  caddy:
    image: caddy:2-alpine            # PIN
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [windmill-server]

volumes:
  caddy_data:
