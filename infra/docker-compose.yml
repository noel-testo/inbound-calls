# Inbound Calls — host stack. Phase 0: pin every image tag and record it in docs/DECISIONS.md.
# All secrets come from ../.env. Ingress is a Telnyx SIP trunk into livekit-sip (Phase 2);
# RingCentral diverts the office number to the Telnyx DID. No FreeSWITCH.

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # API key/secret injected here, never written into livekit.yaml.
      # Requires `--env-file ../.env` at compose parse time (see docs/DECISIONS.md).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    depends_on: [redis]
    # Not published: the agent and livekit-sip reach it on the compose network.

  livekit-sip:
    image: livekit/sip:v1.17.0
    restart: unless-stopped
    volumes:
      - ./livekit/sip.yaml:/etc/sip.yaml:ro
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
      LIVEKIT_WS_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on: [livekit, redis]
    # Phase 2: reachable from Telnyx only — publish the SIP port + RTP range on the host,
    # firewalled to Telnyx's IP ranges. The inbound trunk authenticates Telnyx.

  agent:
    build: ../agent                  # Phase 2/3: Dockerfile added here
    restart: unless-stopped
    env_file: ../.env
    depends_on: [livekit]
    volumes:
      - ../config:/app/config:ro

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:v1.822.0
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL}
      MODE: server
    depends_on: []

  windmill-worker:
    image: ghcr.io/windmill-labs/windmill:v1.822.0   # same tag as server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WINDMILL_DATABASE_URL}
      MODE: worker
      WORKER_GROUP: default
    depends_on: [windmill-server]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WINDMILL_DOMAIN: ${WINDMILL_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [windmill-server]

volumes:
  caddy_data:
